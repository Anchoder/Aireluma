name: Linux package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build and runtime libraries
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config libgtk-4-dev libplist-dev libssl-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav xvfb fakeroot
      - name: Build Debian package
        run: bash scripts/build-linux.sh
      - name: Check both themes
        run: GTK_A11Y=none GSK_RENDERER=cairo xvfb-run -a target/release/airplay-windows --smoke-test
      - name: Check startup AirPlay announcements
        run: python3 tests/mdns-announcements.py engine/uxplay/build/uxplay
      - name: Check package contents
        run: dpkg-deb --info artifacts/*.deb && dpkg-deb --contents artifacts/*.deb
      - name: Install and remove the package
        run: |
          sudo apt-get install -y ./artifacts/*.deb
          GTK_A11Y=none GSK_RENDERER=cairo xvfb-run -a aireluma --smoke-test
          /usr/lib/aireluma/uxplay -h > /tmp/aireluma-receiver-help.txt
          sudo apt-get remove -y aireluma
      - uses: actions/upload-artifact@v7
        with:
          name: aireluma-linux
          path: artifacts/*.deb
