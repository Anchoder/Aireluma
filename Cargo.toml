[package]
name = "airplay-windows"
version = "0.8.6"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A native desktop AirPlay receiver for iPhone screen and audio mirroring"
repository = "https://github.com/Anchoder/Aireluma"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_6"] }
pangocairo = "0.21"
